[package]
name = "mines-rules"
version = "0.3.0"
edition = "2024"
description = "Mines Afloat's rules (mine placement, flood fill, win), run codes and the leaderboard, with no GPU or physics"
license = "MIT"
publish = false

# A workspace of its own: the leaderboard workflow builds the verifier from here without the
# game's GPU, UI and physics crates (or their build scripts) in its lock file.
[workspace]

[dependencies]
# pinned: mine placement draws from it, and a run code must replay to the same board
fastrand = "=2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "verify-score"
path = "src/bin/verify-score.rs"
