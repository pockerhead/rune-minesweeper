<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Mines Afloat</title>
<meta name="description" content="Minesweeper on a living sea. A native Rust game on the Rune GPU UI framework with Jolt Physics, running in your browser on WebGPU.">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; background: #0b1419; }
  /* a held finger is a flag in the game, not a text selection or the iOS callout */
  html, body, canvas { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #status { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
            font: 15px/1.5 system-ui, sans-serif; color: #cfe3e8; text-align: center; padding: 24px; box-sizing: border-box; }
  #status h1 { margin: 0; font-size: 26px; font-weight: 700; color: #fff; }
  #status a { color: #7fe0c0; }
  #status .bar { width: 180px; height: 3px; background: #1d3038; border-radius: 2px; overflow: hidden; }
  #status .bar i { display: block; width: 40%; height: 100%; background: #7fe0c0; animation: slide 1.1s ease-in-out infinite alternate; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
</style>
</head>
<body>
<div id="status">
  <h1>Mines Afloat</h1>
  <div id="message">Loading the sea…</div>
  <div class="bar"><i></i></div>
  <div><a href="https://github.com/pockerhead/rune-minesweeper">Source and desktop builds on GitHub</a></div>
</div>
<script>
// Two fingers zoom and pan the board. Rune (at the revision the game pins) reads only a
// touch's first finger, so the page tracks every finger and the game reads MINES_TOUCH each
// frame and on each press (src/pinch.rs). `pinched` is set when a second finger lands and
// cleared when a fresh touch begins, so the first finger's press neither opens a cell nor
// plants a flag. Capture listeners on the window hear each event before Rune does.
(() => {
  const touch = globalThis.MINES_TOUCH = { fingers: 0, generation: 0, x: 0, y: 0, spread: 0, pinched: false };
  const fingers = new Map();
  const publish = () => {
    touch.fingers = fingers.size;
    const [a, b] = fingers.values();
    if (!b) return;
    const box = document.querySelector('canvas')?.getBoundingClientRect();
    touch.x = (a.x + b.x) / 2 - (box?.left ?? 0);
    touch.y = (a.y + b.y) / 2 - (box?.top ?? 0);
    touch.spread = Math.hypot(a.x - b.x, a.y - b.y);
  };
  addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch') return;
    // the first finger of a fresh touch: forget any finger whose lift went unheard
    if (e.isPrimary || fingers.size === 0) { fingers.clear(); touch.pinched = false; }
    fingers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (fingers.size >= 2) touch.pinched = true;
    touch.generation++;
    publish();
  }, true);
  addEventListener('pointermove', e => {
    const f = fingers.get(e.pointerId);
    if (!f) return;
    f.x = e.clientX;
    f.y = e.clientY;
    publish();
  }, true);
  const lift = e => {
    if (!fingers.delete(e.pointerId)) return;
    touch.generation++;
    publish();
  };
  addEventListener('pointerup', lift, true);
  addEventListener('pointercancel', lift, true);
  // Safari's own pinch zoom of the page
  addEventListener('gesturestart', e => e.preventDefault());
})();
</script>
<script type="module">
import init from './app.js';
// the page is one 3D scene: start on the GPU (Rune otherwise paints its first frames on the CPU)
globalThis.RUNE_CPU_FIRST = 'off';
const status = document.querySelector('#status');
const message = document.querySelector('#message');
try {
  // ask for the adapter first: an in-app browser (Telegram, Instagram) often has navigator.gpu
  // but no adapter behind it, and the game should say so in plain words
  const adapter = navigator.gpu && await navigator.gpu.requestAdapter().catch(() => null);
  if (!adapter) {
    throw new Error(navigator.gpu
      ? 'This browser has WebGPU switched off or no GPU for it. If you opened the link inside an app (Telegram, Instagram), open it in Chrome or Safari instead.'
      : 'This page needs WebGPU: a recent Chrome or Edge (Android too), Safari 26, or Firefox 141+ on Windows. If you opened the link inside an app, open it in your browser.');
  }
  await init();
  status.remove();
} catch (error) {
  message.textContent = String(error.message ?? error);
  status.querySelector('.bar').remove();
  console.error(error);
}
</script>
</body>
</html>
